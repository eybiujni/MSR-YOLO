# Ultralytics YOLOv5 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov5
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov5n.yaml' will call yolov5.yaml with scale 'n'
  # [depth, width, max_channels]
#  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
#  m: [0.67, 0.75, 1024]
#  l: [1.00, 1.00, 1024]
#  x: [1.33, 1.25, 1024]

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  - [ -1, 1, Conv, [ 64, 6, 2, 2 ] ]  # 0

  - [ -1, 1, Conv, [ 128, 3, 2 ] ]  # 1
  - [ -1, 6, C3, [ 128 ] ] # 2
  - [ -1, 1, FEM, [ 128 ] ] # 3

  - [ -2, 1, Conv, [ 256, 3, 2 ] ]  # 4
  - [ -1, 6, C3, [ 256 ] ] # 5
  - [ -1, 1, FEM, [ 256 ] ] # 6

  - [ -2, 1, Conv, [ 512, 3, 2 ] ]  # 7
  - [ -1, 9, C3, [ 512 ] ] # 8
  - [ -1, 1, SPPF, [ 512, 5 ] ]

# YOLOv5 v6.0 head
head:
  - [-1, 1, Conv, [256, 1, 1]]
  - [ -1, 1, Conv, [ 256, 1, 1 ] ] # 10
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] # 11
  - [ [ -1, 6 ], 1, FFM_Concat2, [ 1 ] ] # 12
  - [ -1, 3, C3, [ 256, False ] ] # 13

  - [ -1, 1, Conv, [ 128, 1, 1 ] ] # 14
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] # 15
  - [ [ -1, 3 ], 1, FFM_Concat2, [ 1 ] ] # 16
  - [ -1, 3, C3, [ 128, False ] ] # 17

  - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 18
  - [ [ -1, 6, 14 ], 1, FFM_Concat3, [ 1 ] ] # 19
  - [ -1, 3, C3, [ 256, False ] ] # 20

  - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 21
  - [ [ -1, 10 ], 1, FFM_Concat2, [ 1 ] ] # 22
  - [ -1, 3, C3, [ 512, False ] ] # 23

  - [ 17, 1, SCAM, [ ] ] # 24
  - [ 20, 1, SCAM, [ ] ] # 25
  - [ 23, 1, SCAM, [ ] ]# 26

  - [ [ 24, 25, 26 ], 1, Detect, [nc] ]